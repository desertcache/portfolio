<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{SUMMARY}}" />
  <meta name="hmw-date" content="{{DATE_ISO}}" />
  <meta name="hmw-summary" content="{{SUMMARY}}" />
  <meta name="theme-color" content="#f6f3ee" />
  <link rel="canonical" href="https://desertcache.github.io/portfolio/blog/posts/{{DATE_ISO}}-hill-money-watch.html" />

  <script>
    // no-FOUC theme, mirrors index.html. Shares the 'sb-theme' key so the
    // homepage and the blog agree on light/dark.
    // alive.js is deliberately NOT loaded here: it gates init on
    // `#theme-toggle && .receipt`, and the blog has no .receipt, so it would
    // silently no-op. The ~12 lines below are the whole of what's needed.
    (function () {
      try {
        var t = localStorage.getItem('sb-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#161412' : '#f6f3ee');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <link rel="stylesheet" href="../../styles-v4.css" />
  <link rel="stylesheet" href="../blog.css" />
</head>
<body>
  <header class="topstrip">
    <div class="topstrip-inner blog-strip">
      <a class="brand-mark" href="../../index.html">Samuel Bates<span class="dot">.</span></a>
      <nav class="topstrip-mid"><a href="../index.html">&larr; All dispatches</a></nav>
      <div class="topstrip-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">&#9680;</button>
      </div>
    </div>
  </header>

  <main class="wrap post-wrap">
    <article class="post">
      <div class="section-num">Dispatch &middot; Hill Money Watch</div>
      <h1 class="post-title">{{TITLE}}</h1>
      <time class="post-date label" datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time>
      <p class="post-summary">{{SUMMARY}}</p>
      <hr class="rule" />
      <div class="post-body body">{{BODY}}</div>
    </article>

    <nav class="post-foot">
      <a class="underline" href="../index.html">&larr; All dispatches</a>
      <a class="underline" href="../../index.html">Back to portfolio</a>
    </nav>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('sb-theme', next); } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', next === 'dark' ? '#161412' : '#f6f3ee');
      });
    })();
  </script>
</body>
</html>
