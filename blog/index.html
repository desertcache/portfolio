<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hill Money Watch — Samuel Bates</title>
  <meta name="description" content="A daily read on congressional trading disclosures." />
  <meta name="theme-color" content="#f6f3ee" />
  <link rel="canonical" href="https://desertcache.github.io/portfolio/blog/" />

  <script>
    // no-FOUC theme, mirrors index.html and _post.template.html.
    (function () {
      try {
        var t = localStorage.getItem('sb-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#161412' : '#f6f3ee');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../styles-v4.css" />
  <link rel="stylesheet" href="blog.css" />
</head>
<body>
  <header class="topstrip">
    <div class="topstrip-inner blog-strip">
      <a class="brand-mark" href="../index.html">Samuel Bates<span class="dot">.</span></a>
      <nav class="topstrip-mid"><a href="../index.html">&larr; Back to portfolio</a></nav>
      <div class="topstrip-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">&#9680;</button>
      </div>
    </div>
  </header>

  <main class="wrap post-wrap">
    <div class="section-num">Dispatch</div>
    <h1 class="post-title">Hill Money Watch</h1>
    <p class="section-lede">
      A daily read on congressional trading disclosures.
    </p>
    <hr class="rule" />
    <div id="archive" class="archive" aria-live="polite">
      <p class="label">Loading&hellip;</p>
    </div>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('sb-theme', next); } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', next === 'dark' ? '#161412' : '#f6f3ee');
      });
    })();
  </script>

  <script>
    // posts.json is generated by scripts/ingest_digest.py from meta tags written
    // by a scheduled task. That is upstream of this page and can drift, so every
    // field is escaped before it touches innerHTML — a title containing markup
    // should render as text, not execute.
    (function () {
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      var root = document.getElementById('archive');
      fetch('posts.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
          var posts = (data && data.posts) || [];
          if (!posts.length) {
            root.innerHTML = '<p class="label">No dispatches published yet.</p>';
            return;
          }
          root.innerHTML = posts.map(function (p) {
            // Noon UTC + timeZone:UTC keeps a plain YYYY-MM-DD from sliding a day
            // backwards for viewers west of Greenwich.
            var d = new Date(p.date + 'T12:00:00Z').toLocaleDateString('en-US', {
              year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
            });
            return '<a class="archive-row" href="' + esc(p.href) + '">' +
                     '<time class="archive-date label" datetime="' + esc(p.date) + '">' + esc(d) + '</time>' +
                     '<div><div class="archive-title">' + esc(p.title) + '</div>' +
                     '<p class="archive-summary">' + esc(p.summary) + '</p></div>' +
                   '</a>';
          }).join('');
        })
        .catch(function () {
          root.innerHTML = '<p class="label">Archive unavailable &mdash; try a refresh.</p>';
        });
    })();
  </script>
</body>
</html>
